document_type: dynamical.capability-registry
schema_version: 0.1.0
registry_id: dynamical-ac-sdl1-capabilities-20260907
capabilities:
  - operation_id: dispense-electrolyte
    kind: scientific
    description: Command pipette dispensing in at most 1000 uL strokes into the test well. Pumps only rinse and drain;
      delivered volume and elapsed handling time are unknown. Cumulative nominal inventory refusal at 3.895 mL is
      a Dynamical bookkeeping constraint, not measured delivery.
    input_ports:
    - id: sample.state
      state_type: sample_state
      unit: '1'
      required: true
      description: The stationary sample identity and its recorded state; command inventory is nominal and custody
        is unchanged.
    output_ports:
    - id: volume_requested_ml
      state_type: number
      unit: mL
      required: true
      description: Requested nominal pipette volume.
    - id: volume_commanded_ml
      state_type: number
      unit: mL
      required: true
      description: Nominal pipette volume command; this electrolyte path does not truncate to integer microlitres.
        No measured delivery.
    - id: volume_applied_ml
      state_type: number
      unit: mL
      required: true
      description: Unknown physical delivered volume; unavailable until measured.
    parameters:
    - name: volume_ml
      value_type: number
      required: true
      unit: mL
      minimum: 0.0
      maximum: 3.895
    - name: chemical
      value_type: string
      required: false
      unit: '1'
      enum: [Ni, Fe, Cr, Mn, Co, Zn, Cu, NH4OH, NaCi, KOH]
    required_conditions: []
    possible_failures: [unsupported or nonfinite command refused without state mutation, physical response and accuracy
        unavailable without measurements]
  - operation_id: aliquot-to-well
    kind: scientific
    description: Command pipette delivery into the same test well in at most 1000 uL strokes. The 3.895 mL limit is
      the labware definition capacity, not a delivery-accuracy claim. Cumulative nominal inventory refusal at 3.895
      mL is a Dynamical bookkeeping constraint, not measured delivery.
    input_ports:
    - id: sample.state
      state_type: sample_state
      unit: '1'
      required: true
      description: The stationary sample identity and its recorded state; command inventory is nominal and custody
        is unchanged.
    output_ports:
    - id: volume_requested_ml
      state_type: number
      unit: mL
      required: true
      description: Requested nominal pipette volume.
    - id: volume_commanded_ml
      state_type: number
      unit: mL
      required: true
      description: Nominal pipette command after integer-microlitre encoding; no delivery measurement.
    - id: volume_applied_ml
      state_type: number
      unit: mL
      required: true
      description: Unknown physical delivered volume; unavailable until measured.
    parameters:
    - name: volume_ml
      value_type: number
      required: true
      unit: mL
      minimum: 0.0
      maximum: 3.895
    - name: chemical
      value_type: string
      required: false
      unit: '1'
      enum: [Ni, Fe, Cr, Mn, Co, Zn, Cu, NH4OH, NaCi, KOH]
    required_conditions: []
    possible_failures: [unsupported or nonfinite command refused without state mutation, physical response and accuracy
        unavailable without measurements]
  - operation_id: condition-ultrasonic
    kind: scientific
    description: Command cartridge-1 ultrasound for 30 s and Arduino temperature setpoint 35 C, the explicit SDL1
      example/main.py:134-140 recipe. Cleaning and cartridge-0 tool commands are separate; no power or response prediction.
    input_ports:
    - id: sample.state
      state_type: sample_state
      unit: '1'
      required: true
      description: The stationary sample identity and its recorded state; command inventory is nominal and custody
        is unchanged.
    output_ports:
    - id: instrument.ultrasound_commanded_s
      state_type: number
      unit: s
      required: true
      description: Commanded relay duration, not measured acoustic exposure.
    - id: instrument.temperature_setpoint_c
      state_type: number
      unit: degC
      required: true
      description: Commanded well temperature setpoint, not sensor readback.
    - id: instrument.temperature_observed_c
      state_type: number
      unit: degC
      required: true
      description: Unknown actual well temperature; unavailable until measured.
    parameters:
    - name: duration_s
      value_type: number
      required: true
      unit: s
      enum: [30.0]
    - name: temperature_setpoint_c
      value_type: number
      required: true
      unit: degC
      enum: [35.0]
    required_conditions: []
    possible_failures: [unsupported or nonfinite command refused without state mutation, physical response and accuracy
        unavailable without measurements]
  - operation_id: electrodeposit-constant-current
    kind: scientific
    description: Command cathodic -0.002827 A for 60 s on Squidstat, with Arduino cartridge-1 temperature setpoint
      35 C (main.py:138-139; experiment.py:2017-2018). Ni tape is the working electrode; Ni tool is counter with reference
      tied during deposition. Followed upstream by 120 s OCP; no physical film or delivery is predicted.
    input_ports:
    - id: sample.state
      state_type: sample_state
      unit: '1'
      required: true
      description: The stationary sample identity and its recorded state; command inventory is nominal and custody
        is unchanged.
    output_ports:
    - id: commanded_charge_c
      state_type: number
      unit: C
      required: true
      description: Signed integral of cathodic current command over its duration; not measured delivered charge.
    - id: deposited_mass_g
      state_type: number
      unit: g
      required: true
      description: Unknown actual deposited mass; no pure-nickel yield assumption.
    - id: deposited_thickness_um
      state_type: number
      unit: um
      required: true
      description: Unknown actual film thickness; unavailable until measured.
    - id: current_density_a_cm2
      state_type: number
      unit: A/cm^2
      required: true
      description: Signed current command divided by upstream area 0.2827 cm^2.
    parameters:
    - name: current_a
      value_type: number
      required: true
      unit: A
      enum: [-0.002827]
    - name: duration_s
      value_type: number
      required: true
      unit: s
      enum: [60.0]
    - name: temperature_setpoint_c
      value_type: number
      required: true
      unit: degC
      enum: [35.0]
    required_conditions: []
    possible_failures: [unsupported or nonfinite command refused without state mutation, physical response and accuracy
        unavailable without measurements]
  - operation_id: measure-oer
    kind: scientific
    description: 'SDL1 complete source measurement protocol: activation at 200 mA/cm^2 for 60 s; two initial CV programs; potentiostatic
      EIS and derived ohmic resistance; 70 s current steps at 100,50,20,10,5,2,1 mA/cm^2; then two final CV programs. The upstream
      headline is the iR-corrected potential over the last third of the 10 mA/cm^2 step, not an overpotential. Parameters and
      extraction semantics are bound in protocols/sdl1-oer.json. Physical responses are unavailable until provenance-bearing
      measurements are admitted.'
    input_ports:
    - {id: sample.state, state_type: sample_state, unit: '1', required: true, description: The stationary electrode sample.
        The full source protocol includes surface-altering activation and final CVs; no post-test physical state or response
        is inferred.}
    output_ports:
    - {id: current_density_a_cm2, state_type: number, unit: A/cm^2, required: true, description: Nominal current density of
        the headline step; not measured current.}
    - {id: potential_at_10ma_cm2_v, state_type: number, unit: V, required: true, description: Unavailable measured potential
        mean over the last third of the 10 mA/cm^2 step.}
    - {id: corrected_potential_at_10ma_cm2_v, state_type: number, unit: V, required: true, description: 'Unavailable upstream
        headline: mean of E - 0.9 R I over the last third of the 10 mA/cm^2 step; potential reference scale is unverified.'}
    - {id: ohmic_resistance_ohm, state_type: number, unit: ohm, required: true, description: Unavailable impedance-derived ohmic
        resistance; source extraction is defined in the bound protocol.}
    - {id: overpotential_v, state_type: number, unit: V, required: true, description: 'Unavailable: any subtraction of 1.229
        V is a Dynamical convention requiring a verified compatible potential reference, not an upstream headline.'}
    parameters:
    - name: protocol_id
      value_type: string
      unit: '1'
      required: true
      enum: [sdl1-oer-2c5a911]
    required_conditions: []
    possible_failures: [protocol response unavailable, reference electrode and potential scale unverified, protocol artifact
        missing or mismatched]
  - operation_id: clean-electrode
    kind: scientific
    description: Command the upstream test-well rinse/drain sequence in place, retaining the deposit record between deposition
      and OER test. Clear only nominal bath command inventory; residual liquid, cleaning efficacy and physical film changes
      remain unknown. The pipette-carried tool cartridge cleaning is a separate upstream sequence.
    input_ports:
    - {id: sample.state, state_type: sample_state, unit: '1', required: true, description: The stationary sample identity and
        its recorded state; command inventory is nominal and custody is unchanged.}
    output_ports:
    - {id: instrument.water_commanded_ml, state_type: number, unit: mL, required: true, description: Sum of water rinse pump
        volume commands; delivery unknown.}
    - {id: instrument.acid_commanded_ml, state_type: number, unit: mL, required: true, description: Sum of acid rinse pump volume
        commands; delivery unknown.}
    - {id: instrument.drain_commanded_ml, state_type: number, unit: mL, required: true, description: Sum of drain pump commands;
        actual removed volume unknown.}
    - {id: instrument.ultrasound_commanded_s, state_type: number, unit: s, required: true, description: Sum of relay-duration
        commands in the well-cleaning sequence.}
    - {id: instrument.residual_volume_ml, state_type: number, unit: mL, required: true, description: Unknown residual volume
        after drain; unavailable until measured.}
    parameters:
    - {name: use_acid, value_type: boolean, unit: '1', required: true}
    - name: acid_dwell_s
      value_type: number
      required: true
      unit: s
      enum: [0.0, 0.1, 30.0]
    required_conditions: []
    possible_failures: [unsupported or nonfinite command refused without state mutation, physical response and accuracy unavailable
        without measurements]
