    role: electrode-wiring-source
    revision: 2c5a911
  - uri: https://github.com/AccelerationConsortium/SDL1_OpenTron_electrodeposition/blob/2c5a911/example/experiment.py#L248-L539
    role: measurement-protocol-source
    revision: 2c5a911
  claim_boundary:
  - 'SDL1 uses one OT-2 deck. Deposition and OER testing act on the stationary Ni-tape working electrode at the
    test-well bottom; the pipette carries the Ni counter-electrode tool, OER counter/reference tool, or flush tool
    to the well. No sample transfer or separate electrochemical-cell loading is modeled. Source: example/experiment.py:154-199,1274-1430,1548-1734,2017-2066;
    parameters.py:27-56; Electric_diagram.pdf page 1.'
  - The geometry archive is AC-hosted SDL1 hardware at tag 0.0.2. FastCat is a separate DTU platform, with its own
    facility bundle. No predictive instrument model in this SDL1 bundle was supplied by AC.
  - Assets labelled execution_visualization_primitive are visualization markers with unknown physical shape and
    placement. Their required dimensions_m, poses, colors and local frame are Dynamical display conventions, not
    physical bounds, collision evidence or metrology. No asset mass is asserted.
  - Admitted exact_source_geometry meshes preserve the source CAD geometry. Scene placements are schematic, not
    measured deck coordinates. Except the recorded 132.5 x 190.5 x 113.7 mm well-cartridge mesh extent, dimensions_m
    are display conventions; cleaning-cartridge and stock-rack values reproduce the upstream labware definition
    footprints, not measured mesh extents. Exact source meshes, not dimensions_m, are the geometry record.
  - Deck slot assignments and tool-rack positions come from example/experiment.py:154-199 and parameters.py:27-56.
    Fourteen test wells are used (parameters.py:57-72); the fifteenth position is reserved for the temperature sensor
    (README.md:97).
  - The working electrode is nickel tape (BOM Ark1 B41); the nickel rod is the deposition counter tool (B52, Electric_diagram.pdf).
    The OER tool combines counter and reference electrodes; the BOM lists Mini Hydroflex, platinum electrode and
    platinum wire (B53-B55). Which reference electrode was physically mounted during a measured run is not established
    by this code.
  - The test well is temperature-controlled by the Arduino (example/experiment.py:2017-2018; src/arduino/main/main.ino:76-93,212-230).
    Its inclusion establishes controller topology, not measured temperature accuracy or uniformity.
  - This bundle supplies no measured SDL1 campaign rows or calibrated physical response predictions.
  - A compiled stage proves scene composition only. Embodied evidence needs a preserved real execution trace, render,
    replay, and inspection. No physical execution is claimed.
  - SDL1 adapters record source-defined commands only. Mixture aliquoting truncates to integer uL; electrolyte dispensing
    preserves its nominal volume. Both issue commands in strokes no greater than 1000 uL. The 3.895 mL admission
    cap follows the labware definition; parameters.py declares 3.9 mL and the main recipe uses 2.5 mL bath plus
    a later 3 mL electrolyte fill. Command inventory is not measured delivered volume.
  - The reference deposition command is cathodic -0.002827 A at a 35 degC setpoint for 60 s (the upstream function
    also has a 10 s default), followed by 120 s OCP. Nominal precursor ratios are not measured film stoichiometry;
    actual mass, thickness, temperature and delivered charge are unavailable.
  - Cleaning retains deposit history while replacing nominal bath inventory, following the same-well sequence between
    deposition and test. Neither perfect liquid removal nor unchanged film chemistry is established. Pumps rinse/drain
    only; pipette dispensing is separate.
  - 'The Arduino exposes temperature setpoint and timed ultrasound, not a power percentage. The admitted well-conditioning
    command is the example recipe: cartridge 1, 30 s at a 35 C setpoint, not a verified continuous hardware envelope.
    Unknown physical outputs are unavailable and carry no invented uncertainty. Except for the OER CP dwell lower
    bound, duration/cost zero is unexecuted-physical-work bookkeeping; actual handling duration and cost remain
    unknown.'
  - measure-oer binds the full SDL1 source protocol, including 0.200 A/cm^2 activation and the 0.100,0.050,0.020,0.010,0.005,0.002,0.001
    A/cm^2 staircase. These fixed source stages are admitted together, not as a continuous calibrated current envelope.
    The last-third iR-corrected potential at 0.010 A/cm^2 is the upstream headline. Any 1.229 V overpotential offset
    is a Dynamical convention; the mounted reference and compatible potential scale remain unverified.
  - Squidstat hardware current/voltage limits and actual elapsed duration are unverified. Device channels have no
    hardware bounds; deposition-only constraints do not describe the full OER protocol.
