document_type: dynamical.facility
schema_version: 0.1.0
facility:
  id: dtu-fastcat
  name: DTU FastCat process abstraction and frozen OER predictor
  schema_version: 0.1.0
  frame:
    up_axis: Z
    length_unit: m
  workstation_ids:
  - fastcat-process
  authoring_basis: representative
  source_refs:
  - uri: https://doi.org/10.11583/DTU.28494185
    role: dataset-source
  claim_boundary:
  - FastCat is a separate DTU platform. The chemical-bath operation name is a Dynamical process abstraction.
    No FastCat hardware geometry, control software, or measured layout is admitted by this bundle; AC SDL1
    geometry and operations are not FastCat hardware.
  - The single fastcat-process workstation is a Dynamical virtual process location, not a claim about
    the physical bench topology. Its marker dimensions, pose, color, and frame are visualization conventions
    only; physical dimensions and equipment positions are unknown. Collision is disabled.
  - ac-bath-simulator records commanded nominal composition and synthesis duration; it does not predict
    deposited chemistry, morphology, yield, or physical delivery accuracy.
  - ac-oer-twin is Dynamical-authored, not supplied by the Acceleration Consortium. Its calibrated claim
    is restricted to the frozen 72-row prediction table at 0.010 A/cm^2. Other compositions and currents
    fail closed.
  - The original 27-composition validation MAE was 22.2 mV. The later 54-composition pool evaluation MAE
    was 48.4 mV; 43 labels were single physical runs. The constant half-width remains 0.104969 V after
    the per-row interval gate failed. No untouched FastCat cohort remains for held-out validation.
  - A compiled scene and simulated trace do not prove physical synthesis, motion, transfer, or laboratory
    qualification. There is no physical provider in this facility.
  - The predictor subtracts 1.229 V from its frozen potential estimate as a Dynamical overpotential convention.
    The supplied aggregate record does not independently establish the frozen label-extraction statistic
    or its equivalence to the upstream last-40-sample mean.
