calibration_evidence:
- id: fastcat-oer-e10
  source_artifact_ref: https://doi.org/10.11583/DTU.28494185 (data.zip, MIT license, retrieved 2026-08-11)
  source_sha256: 4238fe558e72c201403972a523e839dec3150bd1052f97ff25632d83ecab46db
  applies_to_model_binding_id: ac-oer-twin-model
  supported_channel_ids:
  - fastcat.overpotential_v
  - fastcat.current_density_a_cm2
  condition_domain:
    fastcat.current_density_a_cm2: exactly 0.010 A/cm^2 (recorded calibrated basis; label-extraction statistic
      is not independently verified by the supplied aggregate record)
    fastcat.overpotential_v: predicted only for the 72 frozen-table compositions under the frozen per-pool
      conditioning; the original 27-composition validation passed 9/9 predeclared gates (MAE 22.2 mV);
      the later 54-composition causal-pool evaluation had MAE 48.4 mV
  validation_design: cross_condition
  metrics:
  - name: held-out-e10-mae
    value: 0.022209
    unit: V
    split: independent_test
    threshold: 0.045
    comparator: le
  - name: uncertainty-coverage-conformal90
    value: 0.963
    unit: '1'
    split: independent_test
    threshold: 0.85
    comparator: ge
  - name: candidate-order-spearman
    value: 0.86
    unit: '1'
    split: independent_test
    threshold: 0.35
    comparator: ge
  - name: top3-retrieval
    value: 0.823
    unit: '1'
    split: independent_test
    threshold: 0.45
    comparator: ge
  limitations:
  - The calibrated basis is exactly 0.010 A/cm^2; no other current density is predicted.
  - Predictions exist only for the 72 frozen-table compositions under the frozen per-pool conditioning;
    all other compositions are refused.
  - The later 54-composition causal-pool evaluation had MAE 48.4 mV; 43 labels were single physical runs
    and 11 had replicates. This is a distinct cohort from the original 27-composition validation (MAE
    22.2 mV).
  - Composition-specific measurement uncertainty and a replicate-variability summary are not verified
    by the aggregate calibration record supplied in this bundle.
  - The per-row interval gate failed on the pool evaluation; the frozen constant interval covered 49 of
    54 labels (0.907). The constant half-width stays unchanged.
  - No untouched FastCat cohort remains for another held-out validation; these results do not authorize
    recalibration or stronger predictive claims.
  - The recorded interval half-width is 0.104969 V at 90% target coverage using split-conformal calibration;
    the development-cohort size is not verified by the supplied aggregate record.
  split_rule_ref: calibration/fastcat-oer/calibration_report.json
  split_rule_sha256: 8ffcb647031c5f381563152567c698f5590f76166b949e16da8110037d155924
  fit_artifact_ref: calibration/fastcat-oer/prediction_table.json
  fit_artifact_sha256: 098245794ec3925a16777b3df18eb9fcaf06816588f46cd562dbd8b957fb2728
