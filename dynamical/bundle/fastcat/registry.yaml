document_type: dynamical.capability-registry
schema_version: 0.1.0
registry_id: dynamical-dtu-fastcat-capabilities-20260907
capabilities:
- operation_id: deposit-chemical-bath
  kind: scientific
  description: Deposit a mixed-dopant LDH film on the in-custody Ni-foam sample from a chemical bath,
    writing the requested dopant fractions onto the sample as its recorded nominal composition.
  input_ports:
  - id: sample.state
    state_type: sample_state
    unit: '1'
    required: true
    description: The Ni-foam sample this bath deposition acts on. Deposition writes the recorded nominal
      composition onto this state; no new sample.state identity is produced.
  output_ports:
  - id: deposited_fraction_Cr
    state_type: number
    unit: '1'
    required: true
    description: Recorded Cr dopant fraction of the deposited film.
  - id: deposited_fraction_Al
    state_type: number
    unit: '1'
    required: true
    description: Recorded Al dopant fraction of the deposited film.
  - id: deposited_fraction_Fe
    state_type: number
    unit: '1'
    required: true
    description: Recorded Fe dopant fraction of the deposited film.
  - id: deposited_fraction_Co
    state_type: number
    unit: '1'
    required: true
    description: Recorded Co dopant fraction of the deposited film.
  - id: deposited_fraction_Mn
    state_type: number
    unit: '1'
    required: true
    description: Recorded Mn dopant fraction of the deposited film.
  - id: deposited_fraction_Ni
    state_type: number
    unit: '1'
    required: true
    description: Recorded Ni dopant fraction of the deposited film.
  - id: deposited_fraction_Cu
    state_type: number
    unit: '1'
    required: true
    description: Recorded Cu dopant fraction of the deposited film.
  - id: deposited_fraction_Zn
    state_type: number
    unit: '1'
    required: true
    description: Recorded Zn dopant fraction of the deposited film.
  - id: bath_synthesis_time_s
    state_type: number
    unit: s
    required: true
    description: Delivered bath synthesis time.
  parameters:
  - name: fraction_cr
    value_type: number
    unit: '1'
    required: false
    minimum: 0.0
    maximum: 1.0
  - name: fraction_al
    value_type: number
    unit: '1'
    required: false
    minimum: 0.0
    maximum: 1.0
  - name: fraction_fe
    value_type: number
    unit: '1'
    required: false
    minimum: 0.0
    maximum: 1.0
  - name: fraction_co
    value_type: number
    unit: '1'
    required: false
    minimum: 0.0
    maximum: 1.0
  - name: fraction_mn
    value_type: number
    unit: '1'
    required: false
    minimum: 0.0
    maximum: 1.0
  - name: fraction_ni
    value_type: number
    unit: '1'
    required: false
    minimum: 0.0
    maximum: 1.0
  - name: fraction_cu
    value_type: number
    unit: '1'
    required: false
    minimum: 0.0
    maximum: 1.0
  - name: fraction_zn
    value_type: number
    unit: '1'
    required: false
    minimum: 0.0
    maximum: 1.0
  - name: synthesis_time_s
    value_type: number
    unit: s
    required: false
    minimum: 0.0
    maximum: 3600.0
  required_conditions: []
  possible_failures:
  - the requested dopant fractions do not form a unit simplex
  - no sample is in custody to deposit onto
- operation_id: measure-oer
  kind: scientific
  description: Estimate OER overpotential from the FastCat film nominal composition using the frozen Dynamical
    prediction table at exactly 0.010 A/cm^2. The 1.229 V offset is a Dynamical convention.
  input_ports:
  - id: sample.state
    state_type: sample_state
    unit: '1'
    required: true
    description: 'The sample this measurement reads from. A pure measurement: it does not transform, relocate,
      or consume the sample, so no new sample.state is produced. The selected provider requires the deposited
      film''s recorded precursor composition on this state.'
  output_ports:
  - id: overpotential_v
    state_type: number
    unit: V
    required: true
    description: Estimated OER overpotential, with the provider-declared uncertainty.
  - id: current_density_a_cm2
    state_type: number
    unit: A/cm^2
    required: true
    description: Echoed current density the estimate was computed at.
  parameters:
  - name: current_density_a_cm2
    value_type: number
    unit: A/cm^2
    required: true
    minimum: 0.01
    maximum: 0.01
  required_conditions: []
  possible_failures:
  - the requested current density is outside the fitted basis envelope
  - the measured sample carries no recorded deposit or precursor composition
