name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CODEX_VALIDATOR_REF: 936f5eb3ee223ab34dcb221fa7c5f9943c8092bd
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.12"

      - name: Check lock file
        run: uv lock --check

      - name: Install development dependencies
        run: uv sync --locked --extra dev

      - name: Check source and tests
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest

      - name: Validate skill and plugin
        run: |
          validator_dir="$RUNNER_TEMP/codex-validator"
          git init --quiet "$validator_dir"
          git -C "$validator_dir" remote add origin https://github.com/openai/codex.git
          git -C "$validator_dir" sparse-checkout init --cone
          git -C "$validator_dir" sparse-checkout set \
            codex-rs/skills/src/assets/samples/skill-creator/scripts \
            codex-rs/skills/src/assets/samples/plugin-creator/scripts
          git -C "$validator_dir" fetch --quiet --depth=1 origin "$CODEX_VALIDATOR_REF"
          git -C "$validator_dir" checkout --quiet --detach FETCH_HEAD
          uv run python \
            "$validator_dir/codex-rs/skills/src/assets/samples/skill-creator/scripts/quick_validate.py" \
            skills/dynamical
          uv run python \
            "$validator_dir/codex-rs/skills/src/assets/samples/plugin-creator/scripts/validate_plugin.py" \
            .
          uv run python -m json.tool .agents/plugins/marketplace.json >/dev/null

      - name: Build and inspect the wheel and sdist
        run: |
          wheel_dir="$RUNNER_TEMP/wheelhouse"
          uv build --out-dir "$wheel_dir"
          uv run python - "$wheel_dir" <<'EOF'
          import sys, tarfile, zipfile
          from pathlib import Path

          wheel_dir = Path(sys.argv[1])
          [wheel] = wheel_dir.glob("*.whl")
          [sdist] = wheel_dir.glob("*.tar.gz")
          with zipfile.ZipFile(wheel) as zf:
              members = zf.namelist()
          with tarfile.open(sdist) as tf:
              members += tf.getnames()
          forbidden = (
              "evals/", "docs/", "scripts/", "examples/", "sources/",
              ".step", ".stl", ".mp4", ".ndjson", "artifacts/", "uv.lock",
              "requirement.yaml", "api-log", "api_log", ".env",
          )
          bad = [m for m in members for f in forbidden if f in m.lower()]
          if bad:
              raise SystemExit(f"forbidden members in built packages: {bad}")
          print(f"package inspection passed: {len(members)} members")
          EOF

      - name: Smoke-test the wheel end to end
        run: |
          wheel_dir="$RUNNER_TEMP/wheelhouse"
          smoke_venv="$RUNNER_TEMP/smoke-venv"
          uv venv --python 3.11 "$smoke_venv"
          uv pip install --python "$smoke_venv/bin/python" "$wheel_dir"/*.whl
          uv run python -c "
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tests')
          from _fixtures import write_reference_requirement
          import os
          write_reference_requirement(Path(os.environ['RUNNER_TEMP']) / 'requirement.yaml')
          "
          cd "$RUNNER_TEMP"
          "$smoke_venv/bin/dynamical" --version
          "$smoke_venv/bin/dynamical" capabilities --json >capabilities.json
          "$smoke_venv/bin/dynamical" compose --schema >composition-schema.json
          "$smoke_venv/bin/python" -m json.tool capabilities.json >/dev/null
          "$smoke_venv/bin/python" -m json.tool composition-schema.json >/dev/null
          "$smoke_venv/bin/dynamical" compose requirement.yaml -o composition.json
          "$smoke_venv/bin/dynamical" compile composition.json -o compiled-world
          "$smoke_venv/bin/dynamical" validate compiled-world --json >/dev/null
          "$smoke_venv/bin/dynamical" run compiled-world -o trace.ndjson
          "$smoke_venv/bin/dynamical" validate trace.ndjson --json >/dev/null
          "$smoke_venv/bin/dynamical" run trace.ndjson --mode replay -o replay.ndjson
          "$smoke_venv/bin/dynamical" validate replay.ndjson --json >/dev/null
