document_type: dynamical.campaign-requirement
schema_version: 0.1.0
requirement_id: ultrasonic-conditioning-quickstart
objective:
  id: check-conditioned-sample
  statement: Record temperature and timed-ultrasound commands for one sample in the SDL1 well.
  decision: Confirm that the simulator ran the declared steps and kept their source records.
  proof_requirements:
    - id: conditioning-proof
      operation_id: condition-ultrasonic
      output_port_ids:
        - instrument.ultrasound_commanded_s
      minimum_evidence_class: simulator
      acceptance_rule: The simulator trace and replay pass.
      independent_verification_required: true
inputs:
  - id: campaign.sample-id
    state_type: sample_state
    unit: "1"
    value: sample-quickstart-01
    facility_id: ot2-liquid-handling
steps:
  - step_id: condition
    operation_id: condition-ultrasonic
    minimum_evidence_class: simulator
    parameters:
      - name: duration_s
        value_type: number
        unit: s
        value: 30.0
      - name: temperature_setpoint_c
        value_type: number
        unit: degC
        value: 35.0
    input_bindings:
      - target_port_id: sample.state
        source_kind: campaign_input
        source_id: campaign.sample-id
    depends_on: []
    required_policy_tags:
      - simulation-only
max_cost_usd: 0.0
max_duration_s: 1200.0
