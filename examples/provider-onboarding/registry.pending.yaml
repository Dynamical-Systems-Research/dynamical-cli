document_type: dynamical.capability-registry
schema_version: 0.1.0
registry_id: example-band-gap-proposal-20260819
capabilities:
  - operation_id: estimate-band-gap
    kind: scientific
    description: Estimate the electronic band gap for a material formula.
    input_ports:
      - id: composition.formula
        state_type: string
        unit: "1"
        required: true
        description: The material formula that the model receives.
    output_ports:
      - id: band_gap_ev
        state_type: number
        unit: eV
        required: true
        description: The electronic band gap that the model estimates.
    parameters: []
    required_conditions: []
    possible_failures:
      - the model does not support the composition
providers:
