      observed_at: "2026-08-19T00:00:00Z"
      availability_ref: https://example.invalid/models/band-gap-model@v1.0.0
    admission:
      status: pending
      authority_id: facility-review-pending
      authority_kind: facility_operator
      evidence_refs:
        - source=https://example.invalid/models/band-gap-model
        - revision=v1.0.0
        - owner=Example Laboratory
        - license=Apache-2.0
