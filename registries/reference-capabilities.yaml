document_type: dynamical.capability-registry
schema_version: 0.1.0
registry_id: dynamical-reference-capabilities-20260806
capabilities:
  - operation_id: agitate-sample
    kind: scientific
    description: Apply a bounded agitation command to the 0.25 kg simulator sample.
    input_ports:
      - {id: material.mass_kg, state_type: number, unit: kg, required: true, description: Fixed 0.25 kg simulator mass.}
    output_ports:
      - {id: instrument.agitation_rate_rpm, state_type: number, unit: rpm, required: true, description: Requested simulator agitation rate.}
      - {id: simulator.uncertainty.agitation_rate_rpm, state_type: number, unit: rpm, required: true, description: Simulator-only agitation sensitivity assumption.}
    parameters:
      - {name: agitation-rate, value_type: number, unit: rpm, required: true, minimum: 0.0, maximum: 600.0}
    required_conditions: []
    possible_failures: [the requested mass is not exactly 0.25 kg, the agitation rate is outside the simulator range]
  - operation_id: apply-thermal-program
    kind: scientific
    description: Execute the bounded 0.25 kg wall/core thermal program.
    input_ports:
      - {id: material.mass_kg, state_type: number, unit: kg, required: true, description: Fixed 0.25 kg simulator mass; separate from the 0.03375 kg source simulation row.}
      - {id: material.temperature_K, state_type: number, unit: K, required: true, description: Initial temperature for both simulator sample zones.}
      - {id: instrument.agitation_rate_rpm, state_type: number, unit: rpm, required: true, description: Agitation command from agitate-sample.}
    output_ports:
      - {id: instrument.heat_input_W, state_type: number, unit: W, required: true, description: Simulated heater power estimate.}
      - {id: instrument.heat_flow_to_sample_W, state_type: number, unit: W, required: true, description: Simulated plate-to-wall heat-flow estimate.}
      - {id: simulator.uncertainty.heat_input_W, state_type: number, unit: W, required: true, description: Simulator-only heater-power sensitivity assumption.}
      - {id: simulator.uncertainty.heat_flow_to_sample_W, state_type: number, unit: W, required: true, description: Simulator-only heat-flow sensitivity assumption.}
      - {id: thermal.plate_temperature_K, state_type: number, unit: K, required: true, description: Raw simulator plate state for downstream virtual instruments.}
      - {id: thermal.sample_wall_temperature_K, state_type: number, unit: K, required: true, description: Raw simulator near-wall state.}
      - {id: thermal.sample_core_temperature_K, state_type: number, unit: K, required: true, description: Raw simulator core state.}
      - {id: thermal.sample_temperature_K, state_type: number, unit: K, required: true, description: Raw simulator mass-weighted sample state.}
      - {id: thermal.reaction_progress_estimate, state_type: number, unit: "1", required: true, description: Raw Dynamical-defined reference-row proxy.}
      - {id: thermal.time_above_reference_temperature_s, state_type: number, unit: s, required: true, description: Simulated core time above the 309.5473922729492 K Figure 5 reference-row temperature.}
    parameters:
      - {name: target-temperature, value_type: number, unit: K, required: true, minimum: 303.15, maximum: 343.15}
      - {name: dwell-time, value_type: number, unit: s, required: true, minimum: 0.0, maximum: 1010.004}
    required_conditions: []
    possible_failures: [the requested mass is not exactly 0.25 kg, a control or integration value is invalid]
  - operation_id: measure-plate-temperature
    kind: scientific
    description: Read the virtual plate-temperature instrument from the thermal state.
    input_ports:
      - {id: thermal.plate_temperature_K, state_type: number, unit: K, required: true, description: Raw simulator plate state.}
    output_ports:
      - {id: instrument.plate_temperature_K, state_type: number, unit: K, required: true, description: Simulated plate-temperature instrument estimate.}
      - {id: simulator.uncertainty.plate_temperature_K, state_type: number, unit: K, required: true, description: Simulator-only plate-temperature sensitivity assumption.}
    parameters: []
    required_conditions: []
    possible_failures: [the thermal state is absent or non-finite]
  - operation_id: measure-sample-temperature
    kind: scientific
    description: Read virtual wall, core, and mass-weighted sample temperatures.
    input_ports:
      - {id: thermal.sample_wall_temperature_K, state_type: number, unit: K, required: true, description: Raw simulator wall state.}
      - {id: thermal.sample_core_temperature_K, state_type: number, unit: K, required: true, description: Raw simulator core state.}
      - {id: thermal.sample_temperature_K, state_type: number, unit: K, required: true, description: Raw simulator mean sample state.}
    output_ports:
      - {id: instrument.sample_wall_temperature_K, state_type: number, unit: K, required: true, description: Simulated near-wall temperature instrument estimate.}
      - {id: instrument.sample_core_temperature_K, state_type: number, unit: K, required: true, description: Simulated core temperature instrument estimate.}
      - {id: instrument.sample_temperature_K, state_type: number, unit: K, required: true, description: Simulated mass-weighted temperature instrument estimate.}
      - {id: simulator.uncertainty.sample_wall_temperature_K, state_type: number, unit: K, required: true, description: Simulator-only wall-temperature sensitivity assumption.}
      - {id: simulator.uncertainty.sample_core_temperature_K, state_type: number, unit: K, required: true, description: Simulator-only core-temperature sensitivity assumption.}
      - {id: simulator.uncertainty.sample_temperature_K, state_type: number, unit: K, required: true, description: Simulator-only mean-temperature sensitivity assumption.}
    parameters: []
    required_conditions: []
    possible_failures: [the thermal state is absent or non-finite]
  - operation_id: estimate-temperature-gradient
    kind: scientific
    description: Estimate the virtual wall-minus-core temperature gradient.
    input_ports:
      - {id: thermal.sample_wall_temperature_K, state_type: number, unit: K, required: true, description: Raw simulator wall state.}
      - {id: thermal.sample_core_temperature_K, state_type: number, unit: K, required: true, description: Raw simulator core state.}
    output_ports:
      - {id: instrument.sample_gradient_K, state_type: number, unit: K, required: true, description: Simulated wall-minus-core temperature gradient.}
      - {id: simulator.uncertainty.sample_gradient_K, state_type: number, unit: K, required: true, description: Simulator-only gradient sensitivity assumption.}
    parameters: []
    required_conditions: []
    possible_failures: [either thermal zone state is absent or non-finite]
  - operation_id: measure-sample-mass
    kind: scientific
    description: Read the fixed virtual sample-mass instrument.
    input_ports:
      - {id: material.mass_kg, state_type: number, unit: kg, required: true, description: Fixed 0.25 kg simulator mass.}
    output_ports:
      - {id: instrument.sample_mass_kg, state_type: number, unit: kg, required: true, description: Simulated mass-instrument estimate.}
      - {id: simulator.uncertainty.sample_mass_kg, state_type: number, unit: kg, required: true, description: Simulator-only mass sensitivity assumption.}
    parameters: []
    required_conditions: []
    possible_failures: [the requested mass is not exactly 0.25 kg]
  - operation_id: measure-mixing-load
    kind: scientific
    description: Estimate virtual stirrer torque from agitation and sample temperature.
    input_ports:
      - {id: instrument.agitation_rate_rpm, state_type: number, unit: rpm, required: true, description: Agitation command from agitate-sample.}
      - {id: thermal.sample_temperature_K, state_type: number, unit: K, required: true, description: Raw simulator mean sample state.}
    output_ports:
      - {id: instrument.stirrer_torque_N_m, state_type: number, unit: "N*m", required: true, description: Simulated mixing-load estimate.}
      - {id: simulator.uncertainty.stirrer_torque_N_m, state_type: number, unit: "N*m", required: true, description: Simulator-only torque sensitivity assumption.}
    parameters: []
    required_conditions: []
    possible_failures: [the agitation or thermal state is absent or non-finite]
  - operation_id: estimate-reaction-progress
    kind: scientific
    description: Emit a dimensionless Dynamical-defined reference-row proxy, not a concentration measurement.
    input_ports:
      - {id: thermal.sample_core_temperature_K, state_type: number, unit: K, required: true, description: Raw simulator core state.}
      - {id: thermal.reaction_progress_estimate, state_type: number, unit: "1", required: true, description: Raw Dynamical-defined reference-row proxy.}
      - {id: thermal.time_above_reference_temperature_s, state_type: number, unit: s, required: true, description: Simulated time above the source reference-row temperature.}
    output_ports:
      - {id: material.reaction_progress_estimate, state_type: number, unit: "1", required: true, description: "Dimensionless Dynamical-defined reference-row proxy; not literal source CCCl, a kinetic fit, or physical proof."}
      - {id: simulator.uncertainty.reaction_progress_estimate, state_type: number, unit: "1", required: true, description: Simulator-only progress sensitivity assumption.}
    parameters: []
    required_conditions: []
    possible_failures: [the thermal or proxy state is absent or non-finite]
  - operation_id: measure-reaction-progress
    kind: scientific
    description: Measure physical reaction progress; no admitted provider exists.
    input_ports:
      - {id: material.mass_kg, state_type: number, unit: kg, required: true, description: Physical sample mass.}
    output_ports:
      - {id: material.reaction_progress, state_type: number, unit: "1", required: true, description: Physical reaction-progress measurement from an admitted instrument.}
    parameters: []
    required_conditions: []
    possible_failures: [no admitted physical reaction-progress instrument is available]
