document_type: dynamical.capability-registry
schema_version: 0.1.0
registry_id: dynamical-ac-electrodeposition-capabilities-20260812
capabilities:
  - operation_id: dispense-electrolyte
    kind: scientific
    description: Dispense electrolyte from an OT-2 stock reservoir through the syringe pump, reporting requested and pump-applied volume.
    input_ports:
      - {id: sample.state, state_type: sample_state, unit: "1", required: true, description: "The sample this dispense acts on. Consumed for custody continuity; this is a pump-volume calculation, not a custody change, so no new sample.state is produced."}
    output_ports:
      - {id: volume_requested_ml, state_type: number, unit: mL, required: true, description: Requested dispense volume.}
      - {id: volume_applied_ml, state_type: number, unit: mL, required: true, description: Pump-applied volume after the quantized pump-time-step relation.}
    parameters:
      - {name: volume_ml, value_type: number, unit: mL, required: true, minimum: 0.0, maximum: 25.0}
      - {name: chemical, value_type: string, unit: "1", required: false, enum: [Ni, Fe, Cr, Mn, Co, Zn, Cu, NH4OH, NaCi]}
    required_conditions: []
    possible_failures: [the requested volume exceeds the 25 mL stock-reservoir envelope, the named chemical is not an admitted stock]
  - operation_id: aliquot-to-well
    kind: scientific
    description: Aliquot electrolyte from the OT-2 pipette into one test-plate well, reporting requested and pump-applied volume.
    input_ports:
      - {id: sample.state, state_type: sample_state, unit: "1", required: true, description: "The sample this aliquot acts on. Consumed for custody continuity; this is a pump-volume calculation, not a custody change, so no new sample.state is produced."}
    output_ports:
      - {id: volume_requested_ml, state_type: number, unit: mL, required: true, description: Requested aliquot volume.}
      - {id: volume_applied_ml, state_type: number, unit: mL, required: true, description: Pump-applied volume after the quantized pump-time-step relation.}
    parameters:
      - {name: volume_ml, value_type: number, unit: mL, required: true, minimum: 0.0, maximum: 3.895}
      - {name: chemical, value_type: string, unit: "1", required: false, enum: [Ni, Fe, Cr, Mn, Co, Zn, Cu, NH4OH, NaCi]}
    required_conditions: []
    possible_failures: [the requested volume exceeds the 3895 uL test-plate well envelope, the named chemical is not an admitted stock]
  - operation_id: condition-ultrasonic
    kind: scientific
    description: Run the Arduino-controlled ultrasonic conditioning relay for a bounded duration and power setpoint.
    input_ports:
      - {id: sample.state, state_type: sample_state, unit: "1", required: true, description: "The sample this conditioning acts on. Consumed for custody continuity; conditioning does not relocate, split, or rename the sample, so no new sample.state is produced."}
    output_ports:
      - {id: instrument.conditioning_duration_s, state_type: number, unit: s, required: true, description: Delivered conditioning duration.}
      - {id: instrument.conditioning_setpoint_percent, state_type: number, unit: "%", required: true, description: Delivered power setpoint.}
    parameters:
      - {name: duration_s, value_type: number, unit: s, required: true, minimum: 0.0, maximum: 1800.0}
      - {name: setpoint_percent, value_type: number, unit: "%", required: false, minimum: 0.0, maximum: 100.0}
    required_conditions: []
    possible_failures: [the requested duration exceeds the 1800 s conditioning envelope, the requested setpoint is outside 0-100%]
  - operation_id: deposit-chemical-bath
    kind: scientific
    description: Deposit a mixed-dopant LDH film on the in-custody Ni-foam sample from a chemical bath, writing the requested dopant fractions onto the sample as its recorded nominal composition.
    input_ports:
      - {id: sample.state, state_type: sample_state, unit: "1", required: true, description: "The Ni-foam sample this bath deposition acts on. Deposition writes the recorded nominal composition onto this state; no new sample.state identity is produced."}
    output_ports:
      - {id: deposited_fraction_Ni, state_type: number, unit: "1", required: true, description: Recorded Ni dopant fraction of the deposited film.}
      - {id: bath_synthesis_time_s, state_type: number, unit: s, required: true, description: Delivered bath synthesis time.}
    parameters:
      - {name: fraction_cr, value_type: number, unit: "1", required: false, minimum: 0.0, maximum: 1.0}
      - {name: fraction_al, value_type: number, unit: "1", required: false, minimum: 0.0, maximum: 1.0}
      - {name: fraction_fe, value_type: number, unit: "1", required: false, minimum: 0.0, maximum: 1.0}
      - {name: fraction_co, value_type: number, unit: "1", required: false, minimum: 0.0, maximum: 1.0}
      - {name: fraction_mn, value_type: number, unit: "1", required: false, minimum: 0.0, maximum: 1.0}
      - {name: fraction_ni, value_type: number, unit: "1", required: false, minimum: 0.0, maximum: 1.0}
      - {name: fraction_cu, value_type: number, unit: "1", required: false, minimum: 0.0, maximum: 1.0}
      - {name: fraction_zn, value_type: number, unit: "1", required: false, minimum: 0.0, maximum: 1.0}
      - {name: synthesis_time_s, value_type: number, unit: s, required: false, minimum: 0.0, maximum: 3600.0}
    required_conditions: []
    possible_failures: [the requested dopant fractions do not form a unit simplex, no sample is in custody to deposit onto]
  - operation_id: electrodeposit-constant-current
    kind: scientific
    description: Apply a constant current between the working and counter electrode and estimate charge passed, deposited nickel mass and thickness via Faraday's law.
    input_ports:
      - {id: sample.state, state_type: sample_state, unit: "1", required: true, description: "The sample (working electrode) this deposition acts on. Consumed for custody continuity; deposited mass and thickness are reported as their own output ports rather than folded into a restated sample.state, so no new sample.state is produced."}
    output_ports:
      - {id: charge_c, state_type: number, unit: C, required: true, description: Charge passed (current times duration).}
      - {id: deposited_mass_g, state_type: number, unit: g, required: true, description: "Nickel mass deposited, from Faraday's law at n=2."}
      - {id: deposited_thickness_um, state_type: number, unit: um, required: true, description: Deposited film thickness over the 0.2827 cm^2 electrode area.}
      - {id: current_density_a_cm2, state_type: number, unit: A/cm^2, required: true, description: Applied current divided by electrode area.}
    parameters:
      - {name: current_a, value_type: number, unit: A, required: true, minimum: 0.0, maximum: 0.010}
      - {name: duration_s, value_type: number, unit: s, required: true, minimum: 0.0, maximum: 3600.0}
    required_conditions: []
    possible_failures: [the requested current exceeds the 0.010 A source-verified envelope, the requested duration exceeds 3600 s]
  - operation_id: measure-oer
    kind: scientific
    description: Estimate OER overpotential from the deposited film's recorded precursor composition and the requested current density, via a response fitted to AMPERE-2 physical chronopotentiometry (frozen held-out gates FAILED; W1 evidence only, W2 closed).
    input_ports:
      - {id: sample.state, state_type: sample_state, unit: "1", required: true, description: "The sample this measurement reads from. A pure measurement: it does not transform, relocate, or consume the sample, so no new sample.state is produced. The fitted response requires the deposited film's recorded precursor composition on this state."}
    output_ports:
      - {id: overpotential_v, state_type: number, unit: V, required: true, description: "Estimated OER overpotential, with the fit-residual declared uncertainty."}
      - {id: current_density_a_cm2, state_type: number, unit: A/cm^2, required: true, description: Echoed current density the estimate was computed at.}
    parameters:
      - {name: current_density_a_cm2, value_type: number, unit: A/cm^2, required: true, minimum: 0.010, maximum: 0.050}
    required_conditions: []
    possible_failures: [the requested current density is outside the fitted basis envelope, the measured sample carries no recorded deposit or precursor composition]
  - operation_id: clean-electrode
    kind: scientific
    description: Rinse and drain the working electrode at the OT-2 cleaning cartridge, clearing accumulated electrolyte volumes and the recorded deposit from the sample's scientific state.
    input_ports:
      - {id: sample.state, state_type: sample_state, unit: "1", required: true, description: "The sample this cleaning resets. Consumed for custody continuity; cleaning clears process state in place, so no new sample.state is produced."}
    output_ports:
      - {id: instrument.rinse_volume_ml, state_type: number, unit: mL, required: true, description: Delivered rinse volume.}
      - {id: instrument.ultrasound_s, state_type: number, unit: s, required: true, description: Delivered ultrasound time.}
    parameters:
      - {name: rinse_volume_ml, value_type: number, unit: mL, required: true, minimum: 0.0, maximum: 12.0}
      - {name: ultrasound_s, value_type: number, unit: s, required: false, minimum: 0.0, maximum: 1800.0}
    required_conditions: []
    possible_failures: [the requested rinse volume exceeds the cleaning-cartridge envelope, the requested ultrasound time exceeds the 1800 s relay envelope, no sample is in custody]
  - operation_id: load-electrochemical-cell
    kind: scientific
    description: Seat the sample's working electrode in the electrochemical cell (exact source-derived body, cap, and foil base) so downstream electrochemistry acts on a mounted electrode. A fixture state change; physical motion is supplied by the execution backend.
    input_ports:
      - {id: sample.state, state_type: sample_state, unit: "1", required: true, description: "The sample whose electrode this loading seats. Consumed for custody continuity; seating writes cell state in place, so no new sample.state is produced."}
    output_ports:
      - {id: instrument.cell_id, state_type: string, unit: "1", required: true, description: Identifier of the cell the electrode was seated in.}
      - {id: instrument.cell_seated, state_type: boolean, unit: "1", required: true, description: Whether the electrode seated as commanded.}
    parameters:
      - {name: cell_id, value_type: string, unit: "1", required: true}
      - {name: seated, value_type: boolean, unit: "1", required: false}
      - {name: duration_s, value_type: number, unit: s, required: false, minimum: 0.0}
    required_conditions: []
    possible_failures: [cell_id is empty, no sample is in custody]
  - operation_id: transfer-sample
    kind: transport
    description: Move a sample's custody between AC SDL1 workstations and confirm arrival. A custody change, not a physics model; physical motion is supplied by the execution backend.
    input_ports:
      - {id: sample.state, state_type: sample_state, unit: "1", required: false, description: "The sample already in custody at the source workstation, if one exists; absent when this transfer materializes a new sample."}
    output_ports:
      - {id: instrument.sample_station_id, state_type: string, unit: "1", required: true, description: Confirmed destination workstation id.}
      - {id: instrument.arrival_confirmed, state_type: boolean, unit: "1", required: true, description: Whether arrival at the destination was confirmed.}
      - {id: sample.state.transferred, state_type: sample_state, unit: "1", required: true, description: "The sample's identity after this transfer -- moved to the new station if one was already in custody, or newly materialized. This is the one operation whose purpose is a custody change, so it both consumes and produces sample state; the output id differs from the input id (sample.state) because a capability's own input and output port ids must be distinct."}
    parameters:
      - {name: to_station, value_type: string, unit: "1", required: true}
      - {name: sample_id, value_type: string, unit: "1", required: false}
      - {name: quantity, value_type: number, unit: "1", required: false, minimum: 0.0}
      - {name: unit, value_type: string, unit: "1", required: false}
      - {name: arrival_confirmed, value_type: boolean, unit: "1", required: false}
      - {name: duration_s, value_type: number, unit: s, required: false, minimum: 0.0}
    required_conditions: []
    possible_failures: [to_station is empty, no sample is in custody and no sample_id was supplied to materialize one]
