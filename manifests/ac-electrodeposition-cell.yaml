    squidstat.overpotential_v: predicted only for deposited films whose nominal precursor fractions over Ni, Fe, Cr, Mn, Co, Zn, Cu and NH4OH/NaCi levels are represented in the fit split
  split_rule_ref: registries/calibration/ampere2-oer/frozen_protocol.json
  split_rule_sha256: 7098893d2f556084135c3c93b73b1ef8827b1292e6d258f6ad0b2f5573f5e3de
  fit_artifact_ref: registries/calibration/ampere2-oer/fit.json
  fit_artifact_sha256: e5a9c611cfc78a7ecddf32479eb5974225ed8ce8125bc8ff6d6ae4de476aece6
  validation_design: cross_condition
  metrics:
  - name: held-out-overpotential-mae
    value: 0.38126269391939616
    unit: V
    split: independent_test
    threshold: 0.05
    comparator: le
  - name: uncertainty-coverage-2sigma
    value: 1.0
    unit: '1'
    split: independent_test
    threshold: 0.8
    comparator: ge
  - name: candidate-order-spearman
    value: -0.18793832808714067
    unit: '1'
    split: independent_test
    threshold: 0.7
    comparator: ge
  - name: fit-residual-sigma
    value: 1.8073715433658781
    unit: V
    split: fit
  limitations:
  - The frozen held-out gates FAILED (overpotential MAE and candidate-order preservation), so W2 is closed and this model is W1 evidence only; the failed report is preserved at registries/calibration/ampere2-oer/calibration_report.json.
  - Validation is a cross-condition holdout within a single AMPERE-2 campaign (one lab, one instrument), not independent physical facility runs; bounded W2 requires the latter, so W2 is closed on this ground independent of the failed gates.
  - Fit and held-out data include runs recorded at the instrument compliance rail (~10.63 V) that the upstream dataset marks success; the frozen protocol does not permit post-hoc exclusion, and they dominate the declared sigma. The uncertainty-coverage-2sigma metric passes only because that sigma is large; it is not evidence of calibrated uncertainty.
  - The condition split hashes raw metadata strings and leaks two physically identical conditions across the fit/held-out boundary; split leakage biases held-out performance optimistically, so a clean split can only worsen the already-failed gates. See registries/calibration/ampere2-oer/ERRATA.md.
  - The fit design matrix is rank 9 of 11 (no condition separates Mn from Cu), so those coefficients are not separately identified. See ERRATA.md.
  - Corrected potentials are used on the upstream-reported scale; overpotential_v = corrected potential - 1.23 V carries that reference-scale assumption.
  - Nominal precursor composition is the volume-ratio analogue of the AMPERE-2 recipe units; deposited stoichiometry was not measured upstream in a form admissible as a predictor.
  - The fitted basis is exactly {0.020, 0.050} A/cm^2; the instrument's admitted current-density envelope is restricted to that basis so predictions outside it are flagged out-of-envelope rather than silently extrapolated.
