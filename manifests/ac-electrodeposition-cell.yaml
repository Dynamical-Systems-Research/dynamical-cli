devices:
- id: ot2-device
  asset_id: ot2-robot-body
  state_channels:
  - id: ot2.dispense_volume_requested_ml
    value_type: number
    unit: mL
    minimum: 0.0
    maximum: 25.0
  - id: ot2.dispense_volume_applied_ml
    value_type: number
    unit: mL
    minimum: 0.0
    maximum: 25.0
  - id: ot2.aliquot_volume_requested_ml
    value_type: number
    unit: mL
    minimum: 0.0
    maximum: 3.895
  - id: ot2.aliquot_volume_applied_ml
    value_type: number
    unit: mL
    minimum: 0.0
    maximum: 3.895
  capability_ids:
  - dispense-electrolyte-capability
  - aliquot-to-well-capability
- id: arduino-device
  asset_id: arduino-controller-body
  state_channels:
  - id: arduino.conditioning_duration_s
    value_type: number
    unit: s
    minimum: 0.0
    maximum: 1800.0
  - id: arduino.conditioning_setpoint_percent
    value_type: number
    unit: '%'
    minimum: 0.0
    maximum: 100.0
  capability_ids:
  - condition-ultrasonic-capability
- id: squidstat-device
  asset_id: squidstat-instrument-body
  state_channels:
  - id: squidstat.current_a
    value_type: number
    unit: A
    minimum: 0.0
    maximum: 0.01
  - id: squidstat.duration_s
    value_type: number
    unit: s
    minimum: 0.0
    maximum: 3600.0
  - id: squidstat.charge_c
    value_type: number
    unit: C
    minimum: 0.0
  - id: squidstat.deposited_mass_g
    value_type: number
    unit: g
    minimum: 0.0
  - id: squidstat.deposited_thickness_um
    value_type: number
    unit: um
    minimum: 0.0
  - id: squidstat.current_density_a_cm2
    value_type: number
    unit: A/cm^2
    minimum: 0.0
    maximum: 0.1
  - id: squidstat.overpotential_v
    value_type: number
    unit: V
    minimum: 0.0
  capability_ids:
  - electrodeposit-constant-current-capability
  - measure-oer-capability
- id: cleaning-station-device
  asset_id: ot2-cleaning-cartridge
  state_channels:
  - id: cleaning.rinse_volume_ml
    value_type: number
    unit: mL
    minimum: 0.0
    maximum: 12.0
  - id: cleaning.ultrasound_s
    value_type: number
    unit: s
    minimum: 0.0
    maximum: 1800.0
  capability_ids:
  - clean-electrode-capability
- id: cell-fixture-device
  asset_id: echem-cell-main-body
  state_channels:
  - id: cell.cell_id
    value_type: string
    unit: '1'
  - id: cell.cell_seated
    value_type: boolean
    unit: '1'
  capability_ids:
  - load-electrochemical-cell-capability
agents:
- id: transfer-agent
  asset_id: bench-transfer-mechanism
  capability_ids:
  - transfer-sample-capability
  action_endpoint_id: ac-transfer-action-endpoint
