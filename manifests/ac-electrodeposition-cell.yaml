document_type: dynamical.facility
schema_version: 0.1.0
facility:
  id: ac-electrodeposition-cell
  name: AC SDL1 electrodeposition cell
  schema_version: 0.1.0
  frame:
    up_axis: Z
    length_unit: m
  workstation_ids:
  - ot2-liquid-handling
  - arduino-conditioning
  - squidstat-echem
  authoring_basis: derived
  source_refs:
  - uri: https://zenodo.org/records/15575908
    role: hardware-source
    revision: 0.0.2
  - uri: https://github.com/AccelerationConsortium/echem-cell
    role: hardware-source
    revision: 9b063f80a1166475b3249709f4fd3afdb3dadb5d
  claim_boundary:
  - AC SDL1 is one integrated bench with three controllers (OT-2 pipettor, Arduino relay/PID/ultrasound,
    Admiral Squidstat). It is modelled as one facility with three workstations, not three separate facilities,
    so no inter-facility transport gate is exercised by this manifest. Movement between workstations is
    carried explicitly by the transfer-sample capability, and must appear in the trace.
  - A compiled stage is W0 evidence. W1 needs a preserved real execution trace, render, replay, and inspection.
  - The OT-2 body, the Arduino controller enclosure, the Squidstat instrument body, and the OT-2 tiprack
    have no admitted source geometry and are represented as execution_visualization_primitive proxies,
    not exact source geometry.
  - The electrodeposition, OER, dispense/aliquot, and ultrasonic-conditioning models are idealizations
    with declared uncertainty. The AC SDL1 archive contains no experimental electrodeposition, OER, or
    conditioning data, so none of these models is fitted to, or validated against, measured data.
  - Per-asset dimensions_m values are coarse declarative bounds for visualization and collision, not metrology;
    the assembly-well-cartridge-v44 world bounding box (132.5 x 190.5 x 113.7 mm) is the one figure directly
    measured from the admitted conversion (see registries/electrodeposition-source-lock.json notes). The
    referenced exact_source_geometry mesh, not this field, is the geometric record of truth.
workstations:
- id: ot2-liquid-handling
  facility_id: ac-electrodeposition-cell
  member_asset_ids:
  - ot2-robot-body
  - ot2-tiprack
  - ot2-cleaning-cartridge
  - ot2-stock-reservoir-slot-7
  - ot2-test-plate
  - ot2-tool-rack
  - ot2-stock-reservoir-slot-11
  - bench-transfer-mechanism
  local_frame:
    position_m:
      x: 0.0
      y: 0.0
      z: 0.0
    orientation:
      w: 1.0
      x: 0.0
      y: 0.0
      z: 0.0
  bounds_m:
    x: 0.7
    y: 0.6
    z: 0.65
- id: arduino-conditioning
  facility_id: ac-electrodeposition-cell
