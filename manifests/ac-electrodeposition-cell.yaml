    value_type: number
    unit: mL
    required: true
    minimum: 0.0
    maximum: 25.0
  - name: chemical
    value_type: string
    required: false
    enum: [Ni, Fe, Cr, Mn, Co, Zn, Cu, NH4OH, NaCi]
  observation_channel_ids:
