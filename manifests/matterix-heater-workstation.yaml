document_type: dynamical.facility
schema_version: 0.1.0
facility:
  id: matterix-heater-facility
  name: MATTERIX bounded heater workstation
  schema_version: 0.1.0
  frame:
    up_axis: Z
    length_unit: m
  workstation_ids: [heater-workstation]
  authoring_basis: derived
  source_refs:
    - uri: https://github.com/AccelerationConsortium/Matterix
      role: software-source
      revision: 3a55f3b2384b8e2bf0adcb83c5219cebbf1a4e56
    - uri: https://arxiv.org/abs/2601.13232
      role: reference-publication
    - uri: https://github.com/AccelerationConsortium/Matterix/blob/3a55f3b2384b8e2bf0adcb83c5219cebbf1a4e56/source/matterix_tasks/matterix_tasks/test_dev_tasks/test_semantics_heat_transfer.py
      role: heater-semantics-source
      revision: 3a55f3b2384b8e2bf0adcb83c5219cebbf1a4e56
  claim_boundary:
    - The workstation uses the public MATTERIX heat-transfer task and its declared assets and semantics.
    - A compiled stage is W0 evidence. W1 needs a preserved real MATTERIX workflow, render, trace, replay, and inspection.
    - The thermal model is bounded and does not model a complete chemical mechanism.
    - The source-backed 0.03375 kg Figure 5 simulation row stays separate from the executable 0.25 kg wall/core simulator and does not validate scale transfer.
    - Dynamical defines the 0.25 kg reaction-progress proxy as simulated core time above the row's 309.5473922729492 K temperature divided by its 930.308 s simulation timestamp. The source does not define this as exposure or kinetics; it is not a measurement, physical scale-transfer evidence, or W2 evidence.
workstations:
  - id: heater-workstation
    facility_id: matterix-heater-facility
    member_asset_ids: [heater-table, ika-heater, reaction-beaker, franka-robot]
    local_frame:
      position_m: {x: 0.0, y: 0.0, z: 0.0}
      orientation: {w: 1.0, x: 0.0, y: 0.0, z: 0.0}
    bounds_m: {x: 2.5, y: 2.0, z: 2.2}
assets:
  - id: heater-table
    workstation_id: heater-workstation
    asset_kind: laboratory table
    geometry:
      portable_primitive: cube
      dimensions_m: {x: 1.5, y: 0.9, z: 0.08}
      vendor_uri: isaac-nucleus://Props/Mounts/SeattleLabTable/table_instanceable.usd
      display_color_rgb: [0.38, 0.42, 0.46]
    pose:
      position_m: {x: 0.5, y: 0.0, z: 0.72}
      orientation: {w: 1.0, x: 0.0, y: 0.0, z: 0.0}
    collision: {enabled: true, shape: box}
    manipulation_frames: {}
    physical_properties: {mass_kg: 50.0, static_friction: 0.6, dynamic_friction: 0.5}
    source_refs:
      - uri: https://github.com/AccelerationConsortium/Matterix/blob/3a55f3b2384b8e2bf0adcb83c5219cebbf1a4e56/source/matterix_assets/matterix_assets/infrastructure/tables.py
        role: upstream-asset-configuration
        revision: 3a55f3b2384b8e2bf0adcb83c5219cebbf1a4e56
  - id: ika-heater
    workstation_id: heater-workstation
    asset_kind: IKA heater balance stirrer
    geometry:
      portable_primitive: cube
      dimensions_m: {x: 0.21, y: 0.34, z: 0.13}
      vendor_uri: matterix-assets://equipment/balance-heater-stirrer/IKA-plate-inst.usda
      display_color_rgb: [0.18, 0.22, 0.26]
    pose:
      position_m: {x: 0.4, y: -0.3, z: 0.84}
      orientation: {w: 1.0, x: 0.0, y: 0.0, z: 0.0}
    collision: {enabled: true, shape: convex_hull}
    manipulation_frames:
      pre-place:
        position_m: {x: 0.0, y: 0.0, z: 0.25}
        orientation: {w: 1.0, x: 0.0, y: 0.0, z: 0.0}
      place:
        position_m: {x: 0.0, y: 0.0, z: 0.13}
        orientation: {w: 1.0, x: 0.0, y: 0.0, z: 0.0}
      post-place:
        position_m: {x: 0.0, y: 0.0, z: 0.25}
        orientation: {w: 1.0, x: 0.0, y: 0.0, z: 0.0}
    physical_properties: {mass_kg: 1.0, static_friction: 0.5, dynamic_friction: 0.4}
    source_refs:
      - uri: matterix-assets://equipment/balance-heater-stirrer/IKA-plate-inst.usda
        role: vendor-asset
        revision: 0d856a0572d3e0823204264fd3d2700e15a43f4b
  - id: reaction-beaker
    workstation_id: heater-workstation
    asset_kind: 500 mL beaker
    geometry:
      portable_primitive: cylinder
      dimensions_m: {x: 0.10, y: 0.10, z: 0.14}
      vendor_uri: matterix-assets://labware/beaker500ml/beaker-500ml-inst.usda
      display_color_rgb: [0.42, 0.72, 0.86]
    pose:
      position_m: {x: 0.6, y: 0.05, z: 0.84}
      orientation: {w: 1.0, x: 0.0, y: 0.0, z: 0.0}
    collision: {enabled: true, shape: convex_hull}
    manipulation_frames:
      pre-grasp:
        position_m: {x: 0.0, y: 0.0, z: 0.04}
        orientation: {w: 1.0, x: 0.0, y: 0.0, z: 0.0}
      grasp:
        position_m: {x: 0.0, y: 0.0, z: 0.0}
        orientation: {w: 1.0, x: 0.0, y: 0.0, z: 0.0}
      post-grasp:
        position_m: {x: 0.0, y: 0.0, z: 0.05}
        orientation: {w: 1.0, x: 0.0, y: 0.0, z: 0.0}
    physical_properties: {mass_kg: 0.3, static_friction: 0.4, dynamic_friction: 0.3}
    source_refs:
      - uri: matterix-assets://labware/beaker500ml/beaker-500ml-inst.usda
        role: vendor-asset
        revision: 0d856a0572d3e0823204264fd3d2700e15a43f4b
  - id: franka-robot
    workstation_id: heater-workstation
    asset_kind: Franka fixed-base manipulator
    geometry:
      portable_primitive: capsule
      dimensions_m: {x: 0.35, y: 0.35, z: 1.15}
      vendor_uri: isaac-nucleus://Robots/FrankaEmika/panda_instanceable.usd
      display_color_rgb: [0.86, 0.88, 0.92]
    pose:
      position_m: {x: -0.55, y: 0.0, z: 0.575}
      orientation: {w: 1.0, x: 0.0, y: 0.0, z: 0.0}
    collision: {enabled: true, shape: convex_hull}
    manipulation_frames:
      grasping-frame:
        position_m: {x: 0.0, y: 0.0, z: 0.80}
        orientation: {w: 1.0, x: 0.0, y: 0.0, z: 0.0}
    physical_properties: {mass_kg: 20.0}
    source_refs:
      - uri: https://github.com/AccelerationConsortium/Matterix/blob/3a55f3b2384b8e2bf0adcb83c5219cebbf1a4e56/source/matterix_assets/matterix_assets/robots/franka_arms.py
        role: upstream-asset-configuration
        revision: 3a55f3b2384b8e2bf0adcb83c5219cebbf1a4e56
devices:
  - id: heater-device
    asset_id: ika-heater
    state_channels:
      - {id: heater.on, value_type: boolean, unit: "1"}
      - {id: heater.temperature_K, value_type: number, unit: K, minimum: 273.15, maximum: 473.15}
      - {id: heater.target_temperature_K, value_type: number, unit: K, minimum: 303.15, maximum: 343.15}
    capability_ids: [set-heater, wait-process, observe-process]
  - id: beaker-observation-device
    asset_id: reaction-beaker
    state_channels:
      - {id: beaker.temperature_K, value_type: number, unit: K, minimum: 273.15, maximum: 373.15}
      - {id: beaker.in_contact, value_type: boolean, unit: "1"}
      - {id: balance.mass_kg, value_type: number, unit: kg, minimum: 0.0, maximum: 2.0}
      - {id: camera.average_v, value_type: number, unit: "1", minimum: 0.0, maximum: 255.0}
      - {id: thermal.plate_temperature_K, value_type: number, unit: K, minimum: 273.15, maximum: 473.15}
      - {id: thermal.sample_wall_temperature_K, value_type: number, unit: K, minimum: 273.15, maximum: 373.15}
      - {id: thermal.sample_core_temperature_K, value_type: number, unit: K, minimum: 273.15, maximum: 373.15}
      - {id: thermal.sample_temperature_K, value_type: number, unit: K, minimum: 273.15, maximum: 373.15}
      - {id: thermal.reaction_progress_estimate, value_type: number, unit: "1", minimum: 0.0, maximum: 1.0}
      - {id: thermal.time_above_reference_temperature_s, value_type: number, unit: s, minimum: 0.0, maximum: 1010.004}
      - {id: instrument.heat_input_W, value_type: number, unit: W, minimum: 0.0, maximum: 600.0}
      - {id: instrument.heat_flow_to_sample_W, value_type: number, unit: W}
      - {id: instrument.agitation_rate_rpm, value_type: number, unit: rpm, minimum: 0.0, maximum: 600.0}
      - {id: instrument.plate_temperature_K, value_type: number, unit: K, minimum: 273.15, maximum: 473.15}
      - {id: instrument.sample_wall_temperature_K, value_type: number, unit: K, minimum: 273.15, maximum: 373.15}
      - {id: instrument.sample_core_temperature_K, value_type: number, unit: K, minimum: 273.15, maximum: 373.15}
      - {id: instrument.sample_temperature_K, value_type: number, unit: K, minimum: 273.15, maximum: 373.15}
      - {id: instrument.sample_gradient_K, value_type: number, unit: K, minimum: -100.0, maximum: 100.0}
      - {id: instrument.sample_mass_kg, value_type: number, unit: kg, minimum: 0.25, maximum: 0.25}
      - {id: instrument.stirrer_torque_N_m, value_type: number, unit: "N*m", minimum: 0.0, maximum: 1.0}
      - {id: material.reaction_progress_estimate, value_type: number, unit: "1", minimum: 0.0, maximum: 1.0}
      - {id: simulator.uncertainty.heat_input_W, value_type: number, unit: W, minimum: 0.0}
      - {id: simulator.uncertainty.heat_flow_to_sample_W, value_type: number, unit: W, minimum: 0.0}
      - {id: simulator.uncertainty.agitation_rate_rpm, value_type: number, unit: rpm, minimum: 0.0}
      - {id: simulator.uncertainty.plate_temperature_K, value_type: number, unit: K, minimum: 0.0}
      - {id: simulator.uncertainty.sample_wall_temperature_K, value_type: number, unit: K, minimum: 0.0}
      - {id: simulator.uncertainty.sample_core_temperature_K, value_type: number, unit: K, minimum: 0.0}
      - {id: simulator.uncertainty.sample_temperature_K, value_type: number, unit: K, minimum: 0.0}
      - {id: simulator.uncertainty.sample_gradient_K, value_type: number, unit: K, minimum: 0.0}
      - {id: simulator.uncertainty.sample_mass_kg, value_type: number, unit: kg, minimum: 0.0}
      - {id: simulator.uncertainty.stirrer_torque_N_m, value_type: number, unit: "N*m", minimum: 0.0}
      - {id: simulator.uncertainty.reaction_progress_estimate, value_type: number, unit: "1", minimum: 0.0, maximum: 1.0}
      - {id: simulator.scale_transfer_validated, value_type: boolean, unit: "1"}
      - {id: simulator.uncertainty_basis, value_type: string, unit: "1"}
      - {id: simulator.claim_boundary, value_type: string, unit: "1"}
    capability_ids: []
agents:
  - id: franka-agent
    asset_id: franka-robot
    capability_ids: [pick-beaker, place-beaker]
    action_endpoint_id: matterix-franka-action-endpoint
capabilities:
  - id: set-heater
    provider_id: heater-device
    action_type: set_heater
    parameters:
      - {name: enabled, value_type: boolean, required: true}
      - {name: target-temperature, value_type: number, unit: K, required: false, minimum: 303.15, maximum: 343.15}
    observation_channel_ids: [heater.on, heater.temperature_K, heater.target_temperature_K]
    precondition_constraint_ids: [setpoint-range]
    postcondition_constraint_ids: []
  - id: wait-process
    provider_id: heater-device
    action_type: wait
    parameters:
      - {name: duration, value_type: duration, unit: s, required: true, minimum: 0.0, maximum: 1010.004}
    observation_channel_ids: [beaker.temperature_K, beaker.in_contact, fluidA/CCCl]
    precondition_constraint_ids: [material-mass-positive]
    postcondition_constraint_ids: [solution-temperature-safety-range]
  - id: observe-process
    provider_id: heater-device
    action_type: observe
    parameters: []
    observation_channel_ids: [heater.on, heater.temperature_K, beaker.temperature_K, balance.mass_kg, camera.average_v, fluidA/CCCl]
    precondition_constraint_ids: []
    postcondition_constraint_ids: []
  - id: pick-beaker
    provider_id: franka-agent
    action_type: pick
    parameters:
      - {name: object, value_type: asset_id, required: true, enum: [reaction-beaker]}
    observation_channel_ids: [beaker.in_contact]
    precondition_constraint_ids: [material-mass-positive]
    postcondition_constraint_ids: []
  - id: place-beaker
    provider_id: franka-agent
    action_type: place
    parameters:
      - {name: object, value_type: asset_id, required: true, enum: [reaction-beaker]}
      - {name: target, value_type: asset_id, required: true, enum: [ika-heater]}
    observation_channel_ids: [beaker.in_contact, beaker.temperature_K]
    precondition_constraint_ids: [material-mass-positive]
    postcondition_constraint_ids: []
material_states:
  - id: bounded-reaction-material
    container_asset_id: reaction-beaker
    initial_channels:
      - {channel_id: material.mass_kg, value: 0.25, unit: kg}
      - {channel_id: material.temperature_K, value: 298.15, unit: K}
      - {channel_id: fluidA/CCCl, value: 0.0, unit: mol/kg}
    source_refs:
      - uri: https://arxiv.org/abs/2601.13232
        role: bounded-process-source
model_bindings:
  - id: workstation-process-model
    implementation_ref: external/Matterix/source/matterix_tasks/matterix_tasks/test_dev_tasks/test_semantics_heat_transfer.py
    implementation_sha256: 369092b68570a42d78740efd01b984edf4512f72c7dfc2833abfef2d677ce0a0
    input_channel_map:
      heater.target_temperature_K: heater.target_temperature_K
      material.temperature_K: beaker.temperature_K
    output_channel_map:
      beaker.temperature_K: material.temperature_K
    parameter_map: {update-source: matterix-semantics}
    update_interval_s: 0.008333333333333333
    calibration_evidence_ids: []
  - id: two-zone-thermal-model
    implementation_ref: src/dynamical/thermal.py
    implementation_sha256: b7e495fd1a852c10f101beb14602cad488b9f966b3aee8ec65db848da087b951
    input_channel_map:
      heater.target_temperature_K: control.target_plate_temperature_K
      instrument.agitation_rate_rpm: control.agitation_rate_rpm
      material.mass_kg: sample.mass_kg
      material.temperature_K: sample.initial_temperature_K
    output_channel_map:
      state.plate_temperature_K: thermal.plate_temperature_K
      state.sample_wall_temperature_K: thermal.sample_wall_temperature_K
      state.sample_core_temperature_K: thermal.sample_core_temperature_K
      state.sample_temperature_K: thermal.sample_temperature_K
      state.reaction_progress_estimate: thermal.reaction_progress_estimate
      state.time_above_reference_temperature_s: thermal.time_above_reference_temperature_s
      observation.heat_input_W: instrument.heat_input_W
      observation.heat_flow_to_sample_W: instrument.heat_flow_to_sample_W
      observation.agitation_rate_rpm: instrument.agitation_rate_rpm
      observation.plate_temperature_K: instrument.plate_temperature_K
      observation.sample_wall_temperature_K: instrument.sample_wall_temperature_K
      observation.sample_core_temperature_K: instrument.sample_core_temperature_K
      observation.sample_temperature_K: instrument.sample_temperature_K
      observation.sample_gradient_K: instrument.sample_gradient_K
      observation.sample_mass_kg: instrument.sample_mass_kg
      observation.stirrer_torque_N_m: instrument.stirrer_torque_N_m
      observation.reaction_progress_estimate: material.reaction_progress_estimate
      uncertainty.heat_input_W: simulator.uncertainty.heat_input_W
      uncertainty.heat_flow_to_sample_W: simulator.uncertainty.heat_flow_to_sample_W
      uncertainty.agitation_rate_rpm: simulator.uncertainty.agitation_rate_rpm
      uncertainty.plate_temperature_K: simulator.uncertainty.plate_temperature_K
      uncertainty.sample_wall_temperature_K: simulator.uncertainty.sample_wall_temperature_K
      uncertainty.sample_core_temperature_K: simulator.uncertainty.sample_core_temperature_K
      uncertainty.sample_temperature_K: simulator.uncertainty.sample_temperature_K
      uncertainty.sample_gradient_K: simulator.uncertainty.sample_gradient_K
      uncertainty.sample_mass_kg: simulator.uncertainty.sample_mass_kg
      uncertainty.stirrer_torque_N_m: simulator.uncertainty.stirrer_torque_N_m
      uncertainty.reaction_progress_estimate: simulator.uncertainty.reaction_progress_estimate
      claim.scale_transfer_validated: simulator.scale_transfer_validated
      claim.uncertainty_basis: simulator.uncertainty_basis
      claim.boundary: simulator.claim_boundary
    parameter_map:
      evidence-class: simulator
      sample-mass-kg: 0.25
      wall-mass-fraction: 0.25
      sample-specific-heat-J-per-kg-K: 4180.0
      maximum-heater-power-W: 600.0
      plate-to-wall-conductance-W-per-K: 20.0
      uncertainty-kind: engineering-one-sigma-assumption
      physical-calibration: false
    update_interval_s: 0.5
    calibration_evidence_ids: []
  - id: bounded-constraint-verifier
    implementation_ref: src/dynamical/runtime/constraints.py
    implementation_sha256: 9211c861006f2df7a6d3941fedcc0e1e643b9ce35b42f7309c5e2d371762a1a7
    input_channel_map: {}
    output_channel_map: {}
    parameter_map: {verifier-owner: independent-runtime}
    update_interval_s: 0.001
    calibration_evidence_ids: []
adapter_bindings:
  - id: workstation-matterix-adapter
    target: matterix
    subject_id: matterix-heater-facility
